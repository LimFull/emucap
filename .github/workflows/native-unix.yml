name: Native Unix adapter packages
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact producer commit to build
        type: string
        required: true
      reuse_run:
        description: Optional completed package run to repackage without compiling
        type: string
        default: ''
      adapter:
        type: choice
        default: all
        options: [all, mesen2, dolphin, ppsspp, mednafen, flycast, np2kai, mupen64plus, openmsx, mame-pc98, mame-neogeo, pcsx2, desmume-nds, xemu]
      platform:
        type: choice
        default: all
        options: [all, linux, macos, windows, assemble]
      runtime_run:
        description: Successful Windows build to package when platform is windows
        type: string
        default: ''
      source_run:
        description: Successful Unix package with matching Windows source inputs
        type: string
        default: ''
      source_platform:
        type: choice
        default: macos
        options: [linux, macos]
      packages:
        description: JSON array of adapter, platform and run for assembling all native packages
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: native-unix-${{ inputs.revision }}-${{ inputs.adapter }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.platform != 'windows' && inputs.platform != 'assemble'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        adapter: ${{ fromJSON(inputs.adapter != 'all' && format('["{0}"]', inputs.adapter) || '["mesen2","dolphin","ppsspp","mednafen","flycast","np2kai","mupen64plus","openmsx","mame-pc98","mame-neogeo","pcsx2","desmume-nds","xemu"]') }}
        platform: ${{ fromJSON(inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux","macos"]') }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: packaging
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.adapter == 'mesen2'
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Verify packaging boundaries
        run: python packaging/_tests/release/package_native_tests.py
      - name: Admit native source
        run: python packaging/_tests/release/native_provenance.py source --source source --purpose package --adapter '${{ matrix.adapter }}' --platform '${{ matrix.platform }}'
      - name: Authenticate completed package for reuse
        if: inputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          python packaging/_tests/release/native_provenance.py fetch --run "$REUSE_RUN" \
            --purpose package --adapter '${{ matrix.adapter }}' --platform '${{ matrix.platform }}' \
            --source source --directory previous
      - name: Prepare package tooling
        if: inputs.reuse_run != ''
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = macos ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install sdl3 pkgconf
          else
            sudo apt-get update -qq
            sudo apt-get install -y patchelf
          fi
      - name: Build pinned native adapter
        if: inputs.reuse_run == ''
        shell: bash
        run: |
          set -o pipefail
          bash packaging/_tests/release/native_unix_build.sh '${{ matrix.adapter }}' source 2>&1 | tee native-build.log
      - name: Preserve compiled PCSX2 inputs before packaging
        if: always() && inputs.reuse_run == '' && matrix.adapter == 'pcsx2' && matrix.platform == 'linux' && hashFiles('source/adapters/pcsx2/work/pcsx2/build-emucap/*/pcsx2-qt') != ''
        shell: bash
        run: |
          tar --exclude='.git' --exclude=CMakeFiles --exclude='*.o' --exclude='*.obj' \
            --exclude=target -I 'gzip -1' -cf pcsx2-build.tar.gz -C source \
            adapters/pcsx2/work native-dependencies/pcsx2 native-dependency-sources/pcsx2
          sha256sum pcsx2-build.tar.gz > pcsx2-build.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('pcsx2-build.tar.gz') != ''
        with:
          name: native-build-pcsx2-linux
          path: |
            pcsx2-build.tar.gz
            pcsx2-build.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Verify Linux dependency closure
        if: matrix.platform == 'linux' && inputs.reuse_run == ''
        run: python packaging/_tests/release/package_native_tests.py
      - name: Stage and verify runtime and source packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/_tests/release/package_native.py --source source --adapter '${{ matrix.adapter }}' --platform '${{ matrix.platform }}' --output artifacts ${{ inputs.reuse_run != '' && '--reuse previous' || '' }}
      - name: Attest native provenance
        id: native-attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/NATIVE-PROVENANCE.json
      - name: Retain signed provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.native-attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" artifacts/NATIVE-PROVENANCE.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-package-${{ matrix.adapter }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain incomplete packages for packaging recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: native-incomplete-${{ matrix.adapter }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-build-log-${{ matrix.adapter }}-${{ matrix.platform }}
          path: |
            native-build.log
            source/native-toolchain.txt
          retention-days: 14
  package:
    if: inputs.platform == 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: packaging
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify package boundaries
        run: python packaging/_tests/release/package_windows_tests.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          path: source
          fetch-depth: 0
      - name: Admit native source
        run: python packaging/_tests/release/native_provenance.py source --source source --purpose package --adapter '${{ inputs.adapter }}' --platform windows
      - name: Authenticate native runtime and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: ${{ inputs.runtime_run }}
          SOURCE_RUN: ${{ inputs.source_run }}
          ADAPTER: ${{ inputs.adapter }}
          SOURCE_PLATFORM: ${{ inputs.source_platform }}
        run: |
          python packaging/_tests/release/native_provenance.py fetch --run "$RUNTIME_RUN" \
            --purpose runtime --adapter "$ADAPTER" --platform windows --source source --directory payload
          python packaging/_tests/release/native_provenance.py fetch --run "$SOURCE_RUN" \
            --purpose package --adapter "$ADAPTER" --platform "$SOURCE_PLATFORM" --directory native-source
      - name: Verify and archive native payload
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
          SOURCE_PLATFORM: ${{ inputs.source_platform }}
        run: |
          python packaging/_tests/release/package_windows.py --adapter "$ADAPTER" \
            --source source --payload payload --native-source native-source --output artifacts \
            --source-platform "$SOURCE_PLATFORM" --repo "$GITHUB_REPOSITORY"
      - name: Attest native provenance
        id: native-attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/NATIVE-PROVENANCE.json
      - name: Retain signed provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.native-attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" artifacts/NATIVE-PROVENANCE.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-package-${{ inputs.adapter }}-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    if: inputs.platform == 'assemble'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: packaging
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Admit assembly source
        run: python packaging/_tests/release/native_provenance.py source --source source --purpose assembly
      - name: Verify collection boundaries
        run: python packaging/_tests/release/collect_native_tests.py
      - name: Collect verified native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SELECTION: ${{ inputs.packages }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("selection.json").write_text(os.environ["PACKAGE_SELECTION"])'
          python packaging/_tests/release/collect_native.py --selection selection.json \
            --source source --output artifacts --repo "$GITHUB_REPOSITORY"
      - name: Attest native provenance
        id: native-attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/NATIVE-PROVENANCE.json
      - name: Retain signed provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.native-attestation.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" artifacts/NATIVE-PROVENANCE.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-packages
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-index
          path: |
            artifacts/NATIVE-PACKAGES.json
            artifacts/NATIVE-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
