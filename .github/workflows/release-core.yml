name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (omit for validation only)
        required: false
        type: string
      native_run:
        description: Completed native package assembly run (required for publication)
        required: false
        type: string
      validate_only:
        description: Validate this branch without a tag or publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-core-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          if [ "$VALIDATE_ONLY" = true ]; then
            revision=$(git rev-parse HEAD)
          else
            [[ "$NATIVE_RUN" =~ ^[0-9]+$ ]]
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
            revision=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/core-validation.yml
    with:
      revision: ${{ needs.resolve.outputs.revision }}
      version: ${{ inputs.tag }}

  publish:
    if: ${{ !inputs.validate_only }}
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: packaging
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          merge-multiple: true
          path: core-artifacts
      - name: Authenticate assembly and prepare exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          python packaging/_tests/release/native_release.py --repo "$GITHUB_REPOSITORY" --run "$NATIVE_RUN" \
            --source source --core core-artifacts --native native-artifacts \
            --output prepared --asset-list release-assets.json
      - name: Publish the prepared draft after all package checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REVISION: ${{ needs.resolve.outputs.revision }}
        shell: bash
        run: |
          python packaging/_tests/release/publish_release.py --repo "$GH_REPO" \
            --tag "$RELEASE_TAG" --revision "$SOURCE_REVISION" --asset-list release-assets.json
